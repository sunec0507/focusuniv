<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focusuniv</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;650&family=Noto+Sans+KR:wght@400;500;650;700&display=swap">
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <!--
      THESIS: A student focus desk that treats time as a live object, not a dashboard of cards.
      OWN-WORLD: Cool gray paper #f6f7f9, rail #eceef2, ink lists, 8px corners, one blue #2563EB, Pretendard, hairline rows.
      STORY: Plan the day, run one clock, see the hour as graph paper, keep projects as nested pages.
      FIRST VIEWPORT: Large To-do title, date stepper, completion track, category hairline list with play.
      FORM: Canon operate — Todoist × Reminders × Linear, code-led.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="app">
      <div class="auth-gate" aria-busy="true" aria-live="polite">
        <div class="auth-gate-card">
          <div class="auth-spin" aria-hidden="true"></div>
          <p class="page-date">불러오는 중</p>
        </div>
      </div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "gotrue-js": "/js/vendor/gotrue.js"
        }
      }
    </script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
